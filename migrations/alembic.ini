# Alembic configuration for NexusSearch.
[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# DATABASE_URL environment variable overrides this at runtime.
sqlalchemy.url = postgresql://nexus:nexuspass@localhost:5432/nexussearch

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
